define asn_afd = 65432;
define ip4_afd = 45.154.73.71;
define tag_afd = asn_afd;

ipv4 table afd4;
ipv6 table afd6;

protocol bgp b0_afd {
	description "BGP IPv4+IPv6 AFD (antifilter.download)";
	local as asn_bird;
	ipv4 {
		table afd4;
		import filter {
			bgp_large_community.add((asn_bird, tag_afd, 0));
			accept;
		};
		export none;
	};
	ipv6 {
		table afd6;
		import filter {
			bgp_large_community.add((asn_bird, tag_afd, 0));
			accept;
		};
		export none;
	};
	multihop;
	neighbor ip4_afd as asn_afd;
	hold time 240;
}
