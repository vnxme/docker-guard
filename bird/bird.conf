# Defines bird_asn and bird_ip, generated by env.sh from BIRD_ASN and BIRD_IP
include "/etc/bird/env.conf";

# Large communities (bird_asn, tag, value):
# - (bird_asn, tag_asn_origin, AS number) origin AS number of a route from as.mapping.txt, set from asn_origin
# - (bird_asn, tag_geo_origin, country ID) origin country of a route from iso.mapping.txt, set from geo_origin
# - (bird_asn, tag_asn_group, AS group ID) AS group, ID is set in as.mapping.txt (100 is taken by the generic static routes)
# - (bird_asn, tag_geo_group, country group ID) country group, ID is set in iso.mapping.txt (<1000 are taken by individual countries)
# - (bird_asn, provider AS number, 0) routes of the providers in bgp.conf.d (tag_afd/afn/ref)
define tag_asn_origin = 0;
define tag_geo_origin = 1;
define tag_asn_group = 10;
define tag_geo_group = 11;

# Origin AS number and origin country ID, set per route by the scripts generating static.conf.d
attribute int asn_origin;
attribute int geo_origin;

define no_rt4 = [
	0.0.0.0/0,
	0.0.0.0/8+,
	10.0.0.0/8+,
	100.64.0.0/10+,
	127.0.0.0/8+,
	169.254.0.0/16+,
	172.16.0.0/12+,
	192.0.0.0/24+,
	192.0.2.0/24+,
	192.168.0.0/16+,
	198.18.0.0/15+,
	198.51.100.0/24+,
	203.0.113.0/24+,
	224.0.0.0/4+,
	240.0.0.0/4+,
	255.255.255.255/32
];

define no_rt6 = [
	::/0,
	::/8+,
	64:ff9b::/96+,
	100::/64+,
	2001:db8::/32+,
	3fff::/20+,
	fc00::/7+,
	fe80::/10+,
	ff00::/8+
];

router id bird_ip;

log stderr all;

ipv4 table mixed4;
ipv6 table mixed6;

protocol aggregator a4 {
	description "Aggregator IPv4";

	# export from:
	table mixed4;
	# import to:
	peer table master4;

	import all;
	export filter {
		if ! (source ~ [RTS_STATIC, RTS_BGP]) then reject;
		if net ~ no_rt4 then reject;
		if defined(asn_origin) then bgp_large_community.add((bird_asn, tag_asn_origin, asn_origin));
		if defined(geo_origin) then bgp_large_community.add((bird_asn, tag_geo_origin, geo_origin));
		accept;
	};

	aggregate on net;
	merge by {
		for route r in routes do {
			if ! defined(bgp_path) then { bgp_path = r.bgp_path; }
			bgp_community = bgp_community.add(r.bgp_community);
			bgp_large_community = bgp_large_community.add(r.bgp_large_community);
		}
		accept;
	};
}

protocol aggregator a6 {
	description "Aggregator IPv6";

	# export from:
	table mixed6;
	# import to:
	peer table master6;

	import all;
	export filter {
		if ! (source ~ [RTS_STATIC, RTS_BGP]) then reject;
		if net ~ no_rt6 then reject;
		if defined(asn_origin) then bgp_large_community.add((bird_asn, tag_asn_origin, asn_origin));
		if defined(geo_origin) then bgp_large_community.add((bird_asn, tag_geo_origin, geo_origin));
		accept;
	};

	aggregate on net;
	merge by {
		for route r in routes do {
			if ! defined(bgp_path) then { bgp_path = r.bgp_path; }
			bgp_community = bgp_community.add(r.bgp_community);
			bgp_large_community = bgp_large_community.add(r.bgp_large_community);
		}
		accept;
	};
}

protocol static s4_generic {
	description "Static IPv4 Generic";
	ipv4 {
		table mixed4;
		import filter {
			bgp_large_community.add((bird_asn, tag_asn_group, 100));
			accept;
		};
		export none;
	};
	include "/etc/bird/static.conf.d/*.ipv4.generic.conf";
}

protocol static s6_generic {
	description "Static IPv6 Generic";
	ipv6 {
		table mixed6;
		import filter {
			bgp_large_community.add((bird_asn, tag_asn_group, 100));
			accept;
		};
		export none;
	};
	include "/etc/bird/static.conf.d/*.ipv6.generic.conf";
}

include "/etc/bird/static.conf.d/*.proto.*.conf";

template bgp b4_tpl {
	local as bird_asn;
	graceful restart on;
	ipv4 {
		import none;
		export all;
	};
}

template bgp b6_tpl {
	local as bird_asn;
	graceful restart on;
	ipv6 {
		import none;
		export all;
	};
}

protocol bgp b4_any from b4_tpl {
	description "BGP IPv4 Peering";
	dynamic name "b4_peer";
	passive on;
	multihop;
	neighbor range 0.0.0.0/0 external;
}

protocol bgp b6_any from b6_tpl {
	description "BGP IPv6 Peering";
	dynamic name "b6_peer";
	passive on;
	multihop;
	neighbor range ::/0 external;
}

include "/etc/bird/bgp.conf.d/*.conf";
