# Defines bird_asn and bird_ip, generated by env.sh from BIRD_ASN and BIRD_IP
include "/etc/bird/env.conf";

# Communities:
# - (group_main, tag_*) mark the route type and source, see tag_* below
# - (group_main, ID) mark the AS group, ID is set in as.mapping.txt (100 is taken by the generic static routes)
# - (group_geo, ID) mark the country group, ID is set in iso.mapping.txt
# - (group_afd/afn/ref, tag_*) mark the routes of the providers in bgp.conf.d
# IDs in as.mapping.txt must not reuse the values above: 4, 6, 10, 11, or 100
define group_main = bird_asn;
define group_geo = bird_asn + 1;

define tag_ip4 = 4;
define tag_ip6 = 6;

define tag_asn = 10;
define tag_geo = tag_asn + 1;

define no_rt4 = [
	0.0.0.0/0,
	0.0.0.0/8+,
	10.0.0.0/8+,
	100.64.0.0/10+,
	127.0.0.0/8+,
	169.254.0.0/16+,
	172.16.0.0/12+,
	192.0.0.0/24+,
	192.0.2.0/24+,
	192.168.0.0/16+,
	198.18.0.0/15+,
	198.51.100.0/24+,
	203.0.113.0/24+,
	224.0.0.0/4+,
	240.0.0.0/4+,
	255.255.255.255/32
];

define no_rt6 = [
	::/0,
	::/8+,
	64:ff9b::/96+,
	100::/64+,
	2001:db8::/32+,
	3fff::/20+,
	fc00::/7+,
	fe80::/10+,
	ff00::/8+
];

router id bird_ip;

log stderr all;

ipv4 table mixed4;
ipv6 table mixed6;

protocol aggregator a4 {
	# export from:
	table mixed4;
	# import to:
	peer table master4;

	import all;
	export filter {
		if ! (source ~ [RTS_STATIC, RTS_BGP]) then reject;
		if net ~ no_rt4 then reject;
		accept;
	};

	aggregate on net;
	merge by {
		for route r in routes do {
			if ! defined(bgp_path) then { bgp_path = r.bgp_path; }
			bgp_community = bgp_community.add(r.bgp_community);
		}
		accept;
	};
}

protocol aggregator a6 {
	# export from:
	table mixed6;
	# import to:
	peer table master6;

	import all;
	export filter {
		if ! (source ~ [RTS_STATIC, RTS_BGP]) then reject;
		if net ~ no_rt6 then reject;
		accept;
	};

	aggregate on net;
	merge by {
		for route r in routes do {
			if ! defined(bgp_path) then { bgp_path = r.bgp_path; }
			bgp_community = bgp_community.add(r.bgp_community);
		}
		accept;
	};
}

protocol device d0 {
}

protocol static s4 {
	description "Generic Static IPv4";
	ipv4 {
		table mixed4;
		import filter {
			bgp_community.add((group_main, tag_ip4));
			bgp_community.add((group_main, tag_asn));
			bgp_community.add((group_main, 100));
			accept;
		};
		export none;
	};
	include "/etc/bird/static.conf.d/*.ipv4.generic.conf";
}

protocol static s6 {
	description "Generic Static IPv6";
	ipv6 {
		table mixed6;
		import filter {
			bgp_community.add((group_main, tag_ip6));
			bgp_community.add((group_main, tag_asn));
			bgp_community.add((group_main, 100));
			accept;
		};
		export none;
	};
	include "/etc/bird/static.conf.d/*.ipv6.generic.conf";
}

include "/etc/bird/static.conf.d/*.proto.*.conf";

template bgp bgp4_tpl {
	local as bird_asn;
	ipv4 {
		import none;
		export all;
	};
}

template bgp bgp6_tpl {
	local as bird_asn;
	ipv6 {
		import none;
		export all;
	};
}

protocol bgp bgp4_any from bgp4_tpl {
	dynamic name "bgp4_peer";
	passive on;
	multihop;
	neighbor range 0.0.0.0/0 external;
}

protocol bgp bgp6_any from bgp6_tpl {
	dynamic name "bgp6_peer";
	passive on;
	multihop;
	neighbor range ::/0 external;
}

include "/etc/bird/bgp.conf.d/*.conf";
